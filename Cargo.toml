[package]
name = "agesnap"
version = "0.1.0"
edition = "2024"
description = "Small age-encrypted backup prototype for S3-compatible storage"
license = "Apache-2.0"
readme = "README.md"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[dependencies]
age = "0.11"
blake3 = "1"
zstd = "0.13"
getrandom = "0.3"
libc = "0.2"
rusty-s3 = { version = "0.9", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls", "rustls-webpki-roots"] }
